# Install on Singapore under /etc/ssh/sshd_config.d/ after checking sshd -t.
# The corresponding authorized_keys entry must also restrict the Aliyun source IP.
Match User cdk-gpt-egress
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:18785
    PermitListen none
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    MaxSessions 0
Match all
