# Include inside both Ali HTTP and HTTPS server blocks for cdk.lanting.live.
# SG keeps the only ACME renewal state; this public challenge path never reaches
# the application, and SG serves it from its local /var/www/letsencrypt directory.
location ^~ /.well-known/acme-challenge/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://43.156.235.208;
    proxy_http_version 1.1;
    # No application or EdgeOne origin-auth headers cross this HTTP hop.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host cdk.lanting.live;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_store off;
    proxy_redirect off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
