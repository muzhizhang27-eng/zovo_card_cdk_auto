log_format cdk_redemption_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$cdk_effective_client_ip","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"seconds":$request_time,"upstream_status":"$upstream_status"}';
server {
    listen 80;
    listen [::]:80;
    server_name cdk.lanting.live;
    add_header Cache-Control $cdk_response_cache_control always;
    include /etc/nginx/snippets/cdk-maintenance-gate.conf;
    access_log /var/log/nginx/cdk-redemption-access.log cdk_redemption_json;
    error_log /dev/null crit;
    server_tokens off;
    include /etc/nginx/snippets/cdk-acme-proxy.conf;
    location / {
        return 308 https://cdk.lanting.live$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdk.lanting.live;
    add_header Cache-Control $cdk_response_cache_control always;
    include /etc/nginx/snippets/cdk-maintenance-gate.conf;
    ssl_certificate /etc/cdk-tls/current/fullchain.pem;
    ssl_certificate_key /etc/cdk-tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CDKRedemptionTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/cdk-acme-proxy.conf;
    access_log /var/log/nginx/cdk-redemption-access.log cdk_redemption_json;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 30s;
    root /opt/cdk-recharge/current/web;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = / { return 302 /recharge; }
    location = /lookup { return 302 /history; }
    location = /favicon.ico { return 204; }
    location ~ ^/(recharge|batch|history|billing)/?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /index.html =404;
    }
    location ~ ^/assets/[A-Za-z0-9_.-]+\.(js|css)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
        access_log off;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/javascript text/css;
        gzip_proxied any;
    }
    location = /api/v1/public/site {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $cdk_effective_client_ip;
        proxy_set_header X-Real-IP $cdk_effective_client_ip;
        proxy_set_header X-CDK-Forward-Auth "";
        proxy_set_header X-CDK-Origin-Auth "";
        proxy_set_header X-CDK-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 240s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_cache off;
        proxy_store off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location = /api/v1/setup/status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
