log_format cdk_redemption_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"seconds":$request_time,"upstream_status":"$upstream_status"}';
server {
    listen 80;
    listen [::]:80;
    server_name cdk.lanting.live;
    include /etc/nginx/snippets/cdk-maintenance-gate.conf;
    server_tokens off;
    access_log /var/log/nginx/cdk-redemption-access.log cdk_redemption_json;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://cdk.lanting.live$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdk.lanting.live;
    include /etc/nginx/snippets/cdk-maintenance-gate.conf;
    ssl_certificate /etc/letsencrypt/live/cdk.lanting.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdk.lanting.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CDKRedemptionTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/cdk-redemption-access.log cdk_redemption_json;
    error_log /dev/null crit;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    send_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass https://121.40.64.63:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cdk.lanting.live;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_set_header Host cdk.lanting.live;
        proxy_set_header X-Forwarded-Host cdk.lanting.live;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-CDK-Client-IP $realip_remote_addr;
        include /etc/nginx/cdk-private/cdk-forward-header.conf;
        proxy_set_header X-CDK-Origin-Auth "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header EO-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 240s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_cache off;
        proxy_store off;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
