map_hash_bucket_size 256;
# Ali only. Authenticate the original TCP peer, exact host and per-host secret.
# Empty include files are valid: bridge headers are then ignored for all peers.
map "$realip_remote_addr:$host:$http_x_cdk_forward_auth" $cdk_sg_authenticated {
    default 0;
    include /etc/nginx/cdk-private/cdk-forward-auth.ma[p];
    include /etc/nginx/cdk-private/cdk-admin-forward-auth.ma[p];
}
# EdgeOne peers vary; authenticate its independent per-host origin secret.
# Bracket globs match only the exact .map filename and permit absent files.
map "$host:$http_x_cdk_origin_auth" $cdk_eo_authenticated {
    default 0;
    include /etc/nginx/cdk-private/cdk-origin-auth.ma[p];
    include /etc/nginx/cdk-private/cdk-admin-origin-auth.ma[p];
}
map "$cdk_sg_authenticated:$cdk_eo_authenticated" $cdk_bridge_authenticated {
    default 0;
    "1:0" 1;
    "0:1" 1;
    "1:1" 1;
}
map $cdk_bridge_authenticated $cdk_bridge_candidate_ip {
    default "";
    1 $http_x_cdk_client_ip;
}
# Bound storage before IP parsing; disallow ports, brackets, zone IDs and lists.
map $cdk_bridge_candidate_ip $cdk_bridge_bounded_ip {
    default "";
    "~^[0-9A-Fa-f:.]{2,45}$" $cdk_bridge_candidate_ip;
}
# nginx geo uses 255.255.255.255 for invalid text; explicitly reject that sentinel.
geo $cdk_bridge_bounded_ip $cdk_bridge_ip_valid {
    0.0.0.0/0 1;
    ::/0 1;
    255.255.255.255 0;
}
map $cdk_bridge_ip_valid $cdk_effective_client_ip {
    default $realip_remote_addr;
    1 $cdk_bridge_bounded_ip;
}
